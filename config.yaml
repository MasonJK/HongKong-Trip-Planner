# 홍콩 여행 최적화 설정
trip:
  origin: ICN
  destination: HKG
  arrival_day_of_week: [sunday, saturday]   # 일요일 선호, 토요일도 허용
  nights: 4
  date_range:
    start: 2026-10-01
    end:   2026-11-30
  travelers:
    adults: 4
  budget_per_person_krw: 1500000

flight:
  cabin: economy
  max_stops: 1
  earliest_departure: "06:00"
  latest_arrival:    "23:30"
  preferred_carriers: []      # 현재 미사용 (필터/점수 미연동)
  top_k_per_date: 5

hotel:
  min_review_score: 8.0
  preferred_districts:
    - Tsim Sha Tsui
    - Central
    - Causeway Bay
    - Jordan
  rooms: 2          # 4명 = 2인실 2개
  top_k_per_date: 5

macau:
  airport: MFM
  # 페리 비용 (1인당)
  ferry_round_trip_krw_per_pax: 50000
  ferry_one_way_krw_per_pax:    28000
  # 시나리오 토글 — 옵티마이저가 활성화된 시나리오를 모두 후보로 만들어 점수 비교
  scenarios:
    day_trip:          true    # A: 4박 HK + 마카오 당일치기
    overnight_rt:      true    # B: 3박 HK + 1박 마카오, HKG↔HKG, 페리 왕복
    overnight_mfm_out: true    # C: 3박 HK + 1박 마카오, ICN→HKG 입국 / MFM→ICN 귀국
  hotel:
    min_review_score: 7.5
    top_k_per_date: 3

# 제외할 날짜
exclude_date_ranges:
  - { start: 2026-10-01, end: 2026-10-06, reason: "중국 국경절" }
  - { start: 2026-10-17, end: 2026-10-19, reason: "중양절 (HK 공휴일)" }

ranking:
  weights:
    cost: 0.55
    flight_time: 0.15
    hotel_score: 0.15
    location: 0.10
    cancel_flex: 0.05
  top_n: 10

# mock: 내장 모의 데이터로 즉시 실행
# serpapi: Google Flights/Hotels (.env 또는 env/serp_api.env에 키 필요)
adapter: mock
fx_buffer_pct: 3        # 환율·수수료 버퍼
